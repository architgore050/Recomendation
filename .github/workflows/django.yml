name: Django CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DB_USER: echoflow
      DB_PASSWORD: testpassword
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY || 'test-secret-key-not-for-prod' }}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_STORAGE_BUCKET_NAME: test-bucket

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check no tracked env file has DJANGO_DEBUG=True
        run: bash scripts/check_no_tracked_env.sh

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v1

      - name: Build and start test stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml build
          docker compose -f docker-compose.yml -f docker-compose.test.yml up --no-start db redis_broker redis_cache minio minio-init
          docker compose -f docker-compose.yml -f docker-compose.test.yml start db redis_broker redis_cache minio

      - name: Wait for DB readiness
        run: |
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.yml -f docker-compose.test.yml exec -T db pg_isready -U echoflow; then
              exit 0
            fi
            sleep 2
          done
          echo "DB not ready after 60s"
          exit 1

      - name: Wait for MinIO readiness
        run: |
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.yml -f docker-compose.test.yml exec -T minio mc ready local; then
              exit 0
            fi
            sleep 2
          done
          echo "MinIO not ready after 60s"
          exit 1

      - name: Run migrations
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml exec -T web python manage.py migrate --noinput

      - name: Run Django system checks
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml exec -T web python manage.py check --fail-level WARNING

      - name: Run tests
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml exec -T web pytest backend/app/tests/ --tb=short -v

      - name: Check static files
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml exec -T web python manage.py collectstatic --noinput --dry-run

      - name: Tear down test stack
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml down -v
